name: Desktop packages

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  MACOSX_DEPLOYMENT_TARGET: '12.0'

jobs:
  desktop:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            target: aarch64-apple-darwin
            cross: false
          - runner: macos-15-intel
            target: x86_64-apple-darwin
            cross: false
          - runner: windows-2025
            target: x86_64-pc-windows-msvc
            cross: false
          - runner: windows-11-arm
            target: aarch64-pc-windows-msvc
            cross: false
          - runner: ubuntu-24.04
            target: x86_64-unknown-linux-gnu
            cross: false
          - runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cross: false
          - runner: ubuntu-24.04
            target: riscv64gc-unknown-linux-gnu
            cross: true
    env:
      TARGET: ${{ matrix.target }}
      CROSS_BUILD: ${{ matrix.cross }}
    defaults:
      run:
        shell: bash
        working-directory: ferrsphen
    steps:
      - name: Check out ferrsphen
        uses: actions/checkout@v7
        with:
          path: ferrsphen
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'
      - name: Update Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
          if [[ "$CROSS_BUILD" != 'true' ]]; then
            rustup target add "$TARGET"
          fi
      - name: Cache Cargo
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            .cargo-riscv64/registry
            .cargo-riscv64/git
            ferrsphen/target
          key: desktop-${{ matrix.target }}-${{ hashFiles('ferrsphen/Cargo.toml', 'ferrsphen/.github/workflows/desktop.yml') }}
      - name: Install Linux dependencies
        if: runner.os == 'Linux' && !matrix.cross
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang cmake pkg-config nasm perl \
            libfontconfig-dev libfreetype-dev libwayland-dev libxkbcommon-x11-dev \
            libx11-xcb-dev libssl-dev libzstd-dev libasound2-dev libudev-dev libvulkan-dev libwebkit2gtk-4.1-dev libgtk-3-dev
      - name: Install macOS assembler
        if: runner.os == 'macOS'
        run: command -v nasm >/dev/null || brew install nasm
      - name: Install Windows assembler
        if: runner.os == 'Windows' && startsWith(matrix.target, 'x86_64')
        run: |
          choco install nasm --yes --no-progress
          echo 'C:/Program Files/NASM' >> "$GITHUB_PATH"
      - name: Configure Windows Perl
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $perl = 'C:\Strawberry\perl\bin\perl.exe'
          if (-not (Test-Path -LiteralPath $perl)) {
            choco install strawberryperl --yes --no-progress
            if ($LASTEXITCODE -notin @(0, 1641, 3010)) {
              throw "Strawberry Perl installation failed: $LASTEXITCODE"
            }
          }
          if (-not (Test-Path -LiteralPath $perl)) {
            throw "Windows Perl not found: $perl"
          }
          & $perl '-MLocale::Maketext::Simple' '-MIPC::Cmd' '-e' 'die "Expected Windows Perl\n" unless $^O eq "MSWin32"; print "Perl $] ($^O): OpenSSL prerequisites available\n";'
          if ($LASTEXITCODE -ne 0) {
            throw 'Windows Perl is missing OpenSSL prerequisites'
          }
          "OPENSSL_SRC_PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PERL=$perl" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          (Split-Path -Parent $perl) | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Use static MSVC runtime
        if: runner.os == 'Windows'
        run: echo 'RUSTFLAGS=-C target-feature=+crt-static' >> "$GITHUB_ENV"
      - name: Check locale catalogs
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path

          catalogs = {}
          for language in ('en', 'zh-CN'):
              entries = {}
              for line in (Path('locales') / f'{language}.yml').read_text(encoding='utf-8').splitlines():
                  if not line.strip() or line.lstrip().startswith('#'):
                      continue
                  key, value = line.split(': ', 1)
                  assert key not in entries, f'Duplicate key: {language}/{key}'
                  entries[key] = json.loads(value)
              catalogs[language] = entries
          assert catalogs['en'].keys() == catalogs['zh-CN'].keys(), 'Locale keys differ'
          for key, value in catalogs['en'].items():
              assert set(re.findall(r'%\{(\w+)\}', value)) == set(re.findall(r'%\{(\w+)\}', catalogs['zh-CN'][key])), key
          for source in Path('src').rglob('*.rs'):
              for key in re.findall(r'\bt!\(\s*"([\w.]+)"', source.read_text(encoding='utf-8')):
                  assert key in catalogs['en'], f'{source}: missing {key}'
          PY
      - name: Check captcha callbacks
        run: node src/captcha/bridge.test.cjs
      - name: Build native app-release
        if: runner.os != 'Windows' && !matrix.cross
        run: cargo build --profile app-release --bin ferrsphen --target "$TARGET"
      - name: Build Windows app-release
        if: runner.os == 'Windows'
        shell: pwsh
        run: cargo build --profile app-release --bin ferrsphen --target $env:TARGET
      - name: Build RISC-V app-release
        if: matrix.cross
        run: |
          context="$(mktemp -d "$RUNNER_TEMP/ferrsphen-riscv64.XXXXXX")"
          trap 'rm -rf "$context"' EXIT
          cat > "$context/rustc-riscv64.sh" <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          compiler="$1"
          shift
          crate_name=''
          target=''
          previous=''
          for argument in "$@"; do
            case "$previous" in
              --crate-name) crate_name="$argument" ;;
              --target) target="$argument" ;;
            esac
            previous="$argument"
          done
          # rav1d 1.1 needs nightly for RISC-V vector feature detection.
          if [[ "$crate_name" == 'rav1d' && "$target" == 'riscv64gc-unknown-linux-gnu' ]]; then
            exec "$compiler" '-Zcrate-attr=feature(stdarch_riscv_feature_detection)' "$@"
          fi
          exec "$compiler" "$@"
          SH
          cat > "$context/Dockerfile" <<'DOCKERFILE'
          # Start without buildpack-deps' host development libraries so target
          # headers do not collide with non-coinstallable host package files.
          FROM rust:1-slim-trixie
          RUN dpkg --add-architecture riscv64 \
              && apt-get update \
              && apt-get install -y --no-install-recommends \
                 gcc-riscv64-linux-gnu g++-riscv64-linux-gnu \
                 build-essential clang cmake pkg-config nasm perl git curl ca-certificates \
                 libfontconfig-dev:riscv64 libfreetype-dev:riscv64 libwayland-dev:riscv64 \
                 libxkbcommon-x11-dev:riscv64 libx11-xcb-dev:riscv64 libssl-dev:riscv64 \
                 libzstd-dev:riscv64 libasound2-dev:riscv64 libudev-dev:riscv64 libvulkan-dev:riscv64 \
                 libwebkit2gtk-4.1-dev:riscv64 libgtk-3-dev:riscv64 \
              && rm -rf /var/lib/apt/lists/* \
              && rustup toolchain install nightly --profile minimal --target riscv64gc-unknown-linux-gnu
          COPY rustc-riscv64.sh /usr/local/bin/ferrsphen-rustc
          RUN chmod +x /usr/local/bin/ferrsphen-rustc
          ENV RUSTUP_TOOLCHAIN=nightly \
              RUSTC_WRAPPER=/usr/local/bin/ferrsphen-rustc \
              CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER=riscv64-linux-gnu-gcc \
              CC_riscv64gc_unknown_linux_gnu=riscv64-linux-gnu-gcc \
              CXX_riscv64gc_unknown_linux_gnu=riscv64-linux-gnu-g++ \
              AR_riscv64gc_unknown_linux_gnu=riscv64-linux-gnu-ar \
              PKG_CONFIG_ALLOW_CROSS=1 \
              PKG_CONFIG_LIBDIR=/usr/lib/riscv64-linux-gnu/pkgconfig:/usr/share/pkgconfig \
              CARGO_BUILD_JOBS=2
          WORKDIR /workspace/ferrsphen
          CMD ["cargo", "build", "--profile", "app-release", "--bin", "ferrsphen", "--target", "riscv64gc-unknown-linux-gnu"]
          DOCKERFILE
          docker build --progress=plain -t ferrsphen-riscv64 "$context"
          docker run --rm -v "$GITHUB_WORKSPACE:/workspace" \
            -e CARGO_HOME=/workspace/.cargo-riscv64 ferrsphen-riscv64
      - name: Restore RISC-V build ownership
        if: always() && matrix.cross
        run: |
          build_owner="$(id -u):$(id -g)"
          for path in target Cargo.lock "$GITHUB_WORKSPACE/.cargo-riscv64"; do
            if [[ -e "$path" ]]; then
              sudo chown -R "$build_owner" "$path"
            fi
          done
      - name: Package and verify architecture
        id: package
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          import plistlib
          import shutil
          import struct
          import subprocess
          import tarfile
          import tomllib
          import zipfile
          from pathlib import Path

          root = Path.cwd()
          target = os.environ['TARGET']
          architecture = target.split('-')[0]
          system = 'macos' if 'apple-darwin' in target else 'windows' if 'windows' in target else 'linux'
          version = tomllib.loads((root / 'Cargo.toml').read_text(encoding='utf-8'))['package']['version']
          binary = root / 'target' / target / 'app-release' / ('ferrsphen.exe' if system == 'windows' else 'ferrsphen')
          data = binary.read_bytes()
          assert len(data) >= 64, f'Invalid executable: {binary}'
          if system == 'macos':
              machine = {'x86_64': 0x01000007, 'aarch64': 0x0100000C}[architecture]
              valid = data[:4] == b'\xcf\xfa\xed\xfe' and struct.unpack_from('<I', data, 4)[0] == machine
          elif system == 'windows':
              offset = struct.unpack_from('<I', data, 0x3C)[0]
              machine = {'x86_64': 0x8664, 'aarch64': 0xAA64}[architecture]
              valid = data[:2] == b'MZ' and data[offset:offset + 4] == b'PE\0\0' and struct.unpack_from('<H', data, offset + 4)[0] == machine
          else:
              machine = {'x86_64': 62, 'aarch64': 183, 'riscv64gc': 243}[architecture]
              valid = data[:6] == b'\x7fELF\x02\x01' and struct.unpack_from('<H', data, 18)[0] == machine
          assert valid, f'Executable architecture does not match {target}'

          lock = tomllib.loads((root / 'Cargo.lock').read_text(encoding='utf-8'))
          protocol = next(package['source'] for package in lock['package'] if package['name'] == 'atri_qq')
          metadata = {'version': version, 'target': target, 'profile': 'app-release',
                      'revision': os.environ['GITHUB_SHA'], 'atri_qq_source': protocol}
          arch = {'aarch64': 'arm64', 'riscv64gc': 'riscv64'}.get(architecture, architecture)
          name = f'ferrsphen-{version}-{system}-{arch}'
          stage = root / 'target' / 'desktop-package' / name
          if stage.exists():
              shutil.rmtree(stage)
          stage.mkdir(parents=True)
          output = root / 'dist'
          output.mkdir(exist_ok=True)
          bundle = stage / 'ferrsphen.app'
          resources = bundle / 'Contents' / 'Resources' if system == 'macos' else stage
          resources.mkdir(parents=True, exist_ok=True)
          (resources / 'build.json').write_text(json.dumps(metadata, indent=2) + '\n', encoding='utf-8')
          for license_file in root.glob('LICENSE*'):
              if license_file.is_file():
                  shutil.copy2(license_file, resources / license_file.name)

          if system == 'macos':
              executable = bundle / 'Contents' / 'MacOS' / 'ferrsphen'
              executable.parent.mkdir(parents=True)
              shutil.copy2(binary, executable)
              with (bundle / 'Contents' / 'Info.plist').open('wb') as file:
                  plistlib.dump({'CFBundleExecutable': 'ferrsphen', 'CFBundleIdentifier': 'dev.ferrsphen.app',
                                'CFBundleName': 'ferrsphen', 'CFBundleDisplayName': 'ferrsphen',
                                'CFBundlePackageType': 'APPL', 'CFBundleShortVersionString': version,
                                'CFBundleVersion': version, 'LSMinimumSystemVersion': '12.0',
                                'NSHighResolutionCapable': True, 'NSPrincipalClass': 'NSApplication',
                                'CFBundleDevelopmentRegion': 'en', 'CFBundleLocalizations': ['en', 'zh_CN'],
                                'NSMicrophoneUsageDescription': 'Send voice messages.'}, file)
              subprocess.run(['codesign', '--force', '--sign', '-', str(bundle)], check=True)
              subprocess.run(['codesign', '--verify', '--deep', '--strict', str(bundle)], check=True)
              archive = output / f'{name}.app.zip'
              subprocess.run(['ditto', '-c', '-k', '--sequesterRsrc', '--keepParent', str(bundle), str(archive)], check=True)
          else:
              executable = stage / binary.name
              shutil.copy2(binary, executable)
              executable.chmod(0o755)
              if system == 'windows':
                  archive = output / f'{name}.zip'
                  with zipfile.ZipFile(archive, 'w', zipfile.ZIP_DEFLATED) as file:
                      for item in sorted(stage.iterdir()):
                          file.write(item, f'{name}/{item.name}')
              else:
                  archive = output / f'{name}.tar.gz'
                  with tarfile.open(archive, 'w:gz') as file:
                      file.add(stage, arcname=name)
                  with tarfile.open(archive) as file:
                      assert file.getmember(f'{name}/ferrsphen').mode & 0o111, 'Missing execute permission'
          with archive.open('rb') as file:
              digest = hashlib.file_digest(file, 'sha256').hexdigest()
          checksum = archive.with_name(archive.name + '.sha256')
          checksum.write_text(f'{digest}  {archive.name}\n', encoding='utf-8')
          with Path(os.environ['GITHUB_OUTPUT']).open('a', encoding='utf-8') as file:
              file.write(f"package-path=ferrsphen/{archive.relative_to(root).as_posix()}\n")
              file.write(f"checksum-path=ferrsphen/{checksum.relative_to(root).as_posix()}\n")
              file.write(f"package-name={archive.name}\n")
          print(archive)
          PY
      - name: Upload package
        id: upload-package
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.package-path }}
          archive: false
          if-no-files-found: error
      - name: Upload checksum
        id: upload-checksum
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.package.outputs.checksum-path }}
          archive: false
          if-no-files-found: error
      - name: Add download links to summary
        env:
          PACKAGE_NAME: ${{ steps.package.outputs.package-name }}
          PACKAGE_URL: ${{ steps.upload-package.outputs.artifact-url }}
          CHECKSUM_URL: ${{ steps.upload-checksum.outputs.artifact-url }}
        run: |
          python - <<'PY'
          import os
          from pathlib import Path

          with Path(os.environ['GITHUB_STEP_SUMMARY']).open('a', encoding='utf-8') as summary:
              summary.write(f"### {os.environ['TARGET']}\n\n")
              summary.write(f"[{os.environ['PACKAGE_NAME']}]({os.environ['PACKAGE_URL']}) · ")
              summary.write(f"[SHA-256]({os.environ['CHECKSUM_URL']})\n\n")
          PY

  release:
    name: Publish tagged packages
    if: startsWith(github.ref, 'refs/tags/')
    needs: desktop
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v8
        with:
          pattern: ferrsphen-*
          path: dist
          merge-multiple: true
          skip-decompress: true
      - name: Create release and upload packages
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          shopt -s nullglob
          packages=(dist/*.zip dist/*.tar.gz)
          if (( ${#packages[@]} == 0 )); then
            echo '::error::No release packages found in dist'
            exit 1
          fi
          assets=()
          for package in "${packages[@]}"; do
            if [[ ! -f "$package" || ! -f "$package.sha256" ]]; then
              echo "::error::Missing package file or checksum: $package"
              exit 1
            fi
            assets+=("$package" "$package.sha256")
          done
          (cd dist && sha256sum --check --strict -- *.sha256)
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --generate-notes
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
