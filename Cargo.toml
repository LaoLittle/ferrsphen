[package]
name = "ferrsphen"
version = "0.1.0"
edition = "2024"
default-run = "ferrsphen"
license = "AGPL-3.0-or-later"

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit"]
ui-tests = ["desktop", "dep:gpui"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", optional = true, features = ["test-support"] }
atri_qq = { path = "../atri_qq", default-features = false }
gpui-kit = { path = "../third_party/gpui-kit/crates/kit", optional = true }
surrealkv = "=1.0.0"
silk-rs = "0.2"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ciborium = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
toml = "1.1"
anyhow = "1"
open = "5"
qrcode = { version = "0.14", default-features = false }

[dev-dependencies]
tempfile = "3"

[[bin]]
name = "ferrsphen"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 0

[[example]]
name = "preview"
required-features = ["desktop"]
