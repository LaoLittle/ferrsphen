[package]
name = "ferrsphen"
version = "0.1.0"
edition = "2024"
default-run = "ferrsphen"
license = "AGPL-3.0-or-later"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = ["desktop"]
desktop = ["dep:gpui-kit", "dep:alhazen-core"]
ui-tests = ["desktop", "dep:gpui"]

[dependencies]
gpui = { package = "gpui-pre", version = "=0.3.9", optional = true, features = ["test-support"] }
atri_qq = { path = "../atri_qq", default-features = false }
gpui-kit = { version = "=0.8.0", optional = true }
alhazen-core = { version = "0.6", optional = true }
surrealkv = "=1.0.0"
chrono = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-value = "0.7"
ciborium = "0.2"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "time", "macros", "fs"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "stream"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
rand = "0.8"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp"] }
toml = "1.1"
anyhow = "1"
open = "5"
base64 = "0.22"
tempfile = "3"
qrcode = { version = "0.14", default-features = false }
prost = "0.14"
pinyin = { version = "0.11", default-features = false, features = ["plain"] }
src = "0.0.6"

[target.'cfg(any(target_os = "ios", target_os = "android"))'.dependencies]
gpui-mobile = { package = "gpui-pre-mobile", git = "https://github.com/longbridge/gpui-mobile", rev = "c24a1308e1dcb47ce94d9ef8d8d05ca4d77d2aa7", default-features = false, features = ["clipboard", "file_selector", "image_picker", "url_launcher", "path_provider", "camera", "video_player"] }

[target.'cfg(target_os = "android")'.dependencies]
android-activity = { version = "0.6", features = ["native-activity"] }
android_logger = "0.15"

[dev-dependencies]
log = "0.4"
async-trait = "0.1"
bytes = "1"
tempfile = "3"

[[bin]]
name = "ferrsphen"
path = "src/main.rs"
required-features = ["desktop"]

[profile.dev]
debug = 0

[[example]]
name = "preview"
required-features = ["desktop"]

[build-dependencies]
prost-build = "0.14"
protoc-bin-vendored = "3"
