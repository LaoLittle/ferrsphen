[package]
name = "adapter-matrix"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
[dependencies]
chat-adapter = { path = "../chat-adapter" }
matrix-sdk = { version = "0.19.1", default-features = false, features = ["e2e-encryption", "sqlite", "bundled-sqlite", "rustls-aws-lc-rs", "sso-login"] }
tokio = { version = "1", features = ["sync", "rt", "time", "fs", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
hex = "0.4"
tracing = "0.1"
[dev-dependencies]
wiremock = "0.6"
tempfile = "3"
