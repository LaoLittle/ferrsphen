syntax = "proto3";
package ferrsphen.expressions;

message FaceWire {
  optional uint32 id = 1;
  optional bytes old = 2;
  optional bytes reserve = 11;
}
message ModernFace {
  optional uint32 id = 1;
  optional string name = 2;
  optional string compatibility = 3;
}
message CommonFace {
  optional uint32 service = 1;
  bytes payload = 2;
  optional uint32 business = 3;
}
message FaceElement {
  FaceWire face = 2;
  repeated CommonFace common = 53;
}
message Environment {
  optional uint32 platform = 1;
  optional string os = 2;
  optional string version = 3;
}
message FavoriteRequest {
  Environment environment = 1;
  optional uint64 uin = 2;
  optional uint32 operation = 3;
  optional uint32 sync = 6;
}
message FavoriteList {
  repeated string ids = 1;
  optional string category = 3;
}
message FavoriteResponse {
  optional uint32 code = 1;
  optional string message = 2;
  FavoriteList list = 4;
}
