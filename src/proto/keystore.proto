syntax = "proto3";
package ferrsphen.session;

message Keystore {
  uint64 uin = 1;
  string uid = 2;
  bytes guid = 3;
  string device_name = 4;
  string android_id = 5;
  string qimei = 6;
  string nickname = 7;
  uint32 age = 8;
  uint32 gender = 9;
  uint32 face_id = 10;
  bytes a1 = 11;
  bytes a1_key = 12;
  bytes a2 = 13;
  bytes a2_key = 14;
  bytes d2 = 15;
  bytes d2_key = 16;
  bytes tgtgt_key = 17;
  bytes no_pic_sig = 18;
  bytes random_key = 19;
  bytes ksid = 20;
  bytes s_key = 21;
  bytes super_key = 22;
  bytes st = 23;
  bytes st_key = 24;
  bytes st_web = 25;
  bytes wt_session_ticket = 26;
  bytes wt_session_ticket_key = 27;
  map<string, string> ps_keys = 28;
  optional uint32 o3_xwid_switch = 29;
  NtTicketTimeMetadata nt_ticket_times = 30;
  WtTicketTimeMetadata wt_ticket_times = 31;
  optional uint64 ticket_generated_unix_seconds = 32;
  string ios_msf_imei = 33;
}

message NtTicketTimeValues {
  optional uint64 raw_field1 = 1;
  optional uint64 raw_field2 = 2;
}

message NtTicketTimeMetadata {
  NtTicketTimeValues field12 = 1;
  NtTicketTimeValues field16 = 2;
  uint64 received_unix_ms = 3;
}

message WtTicketTimeMetadata {
  uint64 next_refresh_unix_seconds = 1;
  uint64 expire_unix_seconds = 2;
}

message Session {
  Keystore keystore = 1;
  string machine_id = 2;
  string qua = 3;
}

message KeystoreFile {
  uint32 schema_version = 1;
  Session session = 2;
}
